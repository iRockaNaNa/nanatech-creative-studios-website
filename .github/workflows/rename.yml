name: Rename homepage
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename homepage
        run: |
          git config user.name "iRockaNaNa"
          git config user.email "iRockaNaNa@users.noreply.github.com"
          git fetch origin iRockaNaNa-patch-1
          git checkout -B iRockaNaNa-patch-1 origin/iRockaNaNa-patch-1
          git mv nanatech-creative-studios-website.html index.html
          git rm -f .github/workflows/rename.yml
          git add -A
          git commit -m "Update index.html - add Weather App and blog post"
          git push origin HEAD:iRockaNaNa-patch-1
